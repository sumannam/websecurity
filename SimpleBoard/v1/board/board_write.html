<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>새 게시글 작성</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f5f5f5; }
        .write-container { max-width: 800px; margin: auto; background: white; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-group textarea { height: 250px; resize: vertical; }
        .readonly-input { background-color: #eee; cursor: not-allowed; }
        .button-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .btn-cancel { background-color: #6c757d; color: white; }
        .btn-cancel:hover { background-color: #5a6268; }
        .btn-submit { background-color: #5cb85c; color: white; }
        .btn-submit:hover { background-color: #4cae4c; }
    </style>
</head>
<body>

<div class="write-container">
    <h2>새 게시글 작성</h2>

    <form action="/board/write" method="POST">
        <!-- 작성자 식별자 -->
        <div class="form-group">
            <label for="author_id">작성자</label>
            <input type="text" id="author_id" name="author_id" class="readonly-input" value="user01" readonly>
        </div>

        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" placeholder="제목을 입력하세요" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" placeholder="내용을 작성하세요" required></textarea>
        </div>

        <div class="button-group">
            <a href="/board" class="btn btn-cancel">취소</a>
            <button type="submit" class="btn btn-submit">등록</button>
        </div>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f5f5f5; }
        .edit-container { max-width: 800px; margin: auto; background: white; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
        .form-group input[type="text"], .form-group textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-group textarea { height: 250px; resize: vertical; }
        .readonly-input { background-color: #eee; cursor: not-allowed; }
        .button-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .btn-cancel { background-color: #6c757d; color: white; }
        .btn-cancel:hover { background-color: #5a6268; }
        .btn-submit { background-color: #337ab7; color: white; }
        .btn-submit:hover { background-color: #286090; }
    </style>
</head>
<body>

<div class="edit-container">
    <h2>게시글 수정</h2>

    <form action="/board/update" method="POST">
        <!-- 수정 대상 게시글 ID -->
        <input type="hidden" name="id" value="2">

        <div class="form-group">
            <label>작성자</label>
            <input type="text" class="readonly-input" value="user01" readonly>
        </div>

        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" value="웹 보안 실습 질문 있습니다." required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" required>안녕하세요.
회원가입 기능 구현 중 파라미터 전달 관련하여 질문이 있습니다.
답변 부탁드립니다.</textarea>
        </div>

        <div class="button-group">
            <a href="/board/view?id=2" class="btn btn-cancel">취소</a>
            <button type="submit" class="btn btn-submit">수정 완료</button>
        </div>
    </form>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 탈퇴 및 삭제</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f5f5f5; }
        .delete-container { width: 420px; margin: auto; padding: 25px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .warning-box { padding: 12px; background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; border-radius: 4px; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .readonly-input { background-color: #eee; cursor: not-allowed; }
        .admin-section { padding: 12px; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 6px; margin-bottom: 15px; }
        .admin-tag { font-size: 11px; color: #721c24; font-weight: bold; margin-bottom: 6px; display: block; }
        .btn-delete { width: 100%; padding: 10px; background-color: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background-color: #c9302c; }
    </style>
</head>
<body>

<div class="delete-container">
    <h2>회원 탈퇴 및 삭제</h2>

    <div class="warning-box">
        회원 정보를 삭제하면 작성한 게시글 및 모든 활동 내역이 함께 삭제되며 복구할 수 없습니다.
    </div>
    
    <form action="/user/delete" method="POST" onsubmit="return confirmDelete()">
        <!-- 일반 사용자 탈퇴용 (hidden id 파라미터) -->
        <input type="hidden" id="target_id" name="id" value="user01">

        <!-- 관리자 전용 삭제 대상 입력창 -->
        <div class="admin-section" id="adminDeleteBox">
            <span class="admin-tag">관리자 권한 - 강제 삭제 대상 지정</span>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="admin_target_id">삭제할 대상 ID</label>
                <input type="text" id="admin_target_id" placeholder="삭제할 회원 ID 입력">
            </div>
        </div>

        <div class="form-group" id="userSelfBox">
            <label>현재 로그인 아이디</label>
            <input type="text" class="readonly-input" value="user01" readonly>
        </div>

        <div class="form-group">
            <label for="pw">비밀번호 확인</label>
            <input type="password" id="pw" name="pw" placeholder="비밀번호 입력">
        </div>

        <button type="submit" class="btn-delete">회원 삭제</button>
    </form>
</div>

<script>
    // 쿠키를 기반으로 일반 유저 / 관리자 UI 분기
    const currentUserRole = document.cookie.includes("role=ADMIN") ? "ADMIN" : "USER";

    if (currentUserRole !== "ADMIN") {
        document.getElementById("adminDeleteBox").style.display = "none";
    } else {
        document.getElementById("userSelfBox").style.display = "none";
    }

    function confirmDelete() {
        // 관리자인 경우 입력한 대상 ID로 hidden input 교체
        if (currentUserRole === "ADMIN") {
            const adminInput = document.getElementById("admin_target_id").value;
            if (adminInput) {
                document.getElementById("target_id").value = adminInput;
            }
        }
        return confirm("정말로 회원을 삭제하시겠습니까?");
    }
</script>

</body>
</html>

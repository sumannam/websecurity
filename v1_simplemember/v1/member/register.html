<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 실습</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f9f9f9; }
        .form-container { width: 360px; padding: 20px; background: white; border: 1px solid #ccc; border-radius: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 10px; background-color: #d9534f; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background-color: #c9302c; }
        .notice { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>회원가입</h2>
    <!-- 
      취약점 포인트:
      1. 별도의 CSRF 토큰 없음
      2. 클라이언트 입력값 필터링 및 패턴 검증(Regex) 완전 제거
      3. 비밀번호 확인을 단순 JS로만 처리하여 우회 가능
    -->
    <form action="/register" method="POST" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="id">아이디</label>
            <input type="text" id="id" name="id">
        </div>

        <div class="form-group">
            <label for="pw">비밀번호</label>
            <!-- 평문으로 전송 및 DB 저장 -->
            <input type="password" id="pw" name="pw">
        </div>

        <div class="form-group">
            <label for="pw_confirm">비밀번호 확인</label>
            <input type="password" id="pw_confirm" name="pw_confirm">
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <!-- Stored XSS 페이로드 주입 지점 -->
            <input type="text" id="name" name="name">
        </div>

        <div class="form-group">
            <label for="cellphone">전화번호</label>
            <input type="text" id="cellphone" name="cellphone" placeholder="010-1234-5678">
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <!-- type="text"로 지정하여 이메일 포맷 검증 우회 -->
            <input type="text" id="email" name="email" placeholder="test@test.com">
        </div>

        <!-- 
          Mass Assignment / Privilege Escalation 포인트:
          클라이언트가 직접 권한을 선택하여 서버로 전송하도록 허용
        
        <div class="form-group">
            <label for="role">사용자 권한 (Role)</label>
            <select id="role" name="role">
                <option value="USER">일반 사용자 (USER)</option>
                <option value="ADMIN">관리자 (ADMIN)</option>
            </select>
        </div>
        -->

        <button type="submit" class="btn-submit">가입하기</button>
    </form>
    
</div>

<script>
    // 부실한 클라이언트 검증: 패킷 변조 도구(Burp Suite 등)나 콘솔 조작으로 쉽게 우회 가능
    function validateForm() {
        var pw = document.getElementById("pw").value;
        var pwConfirm = document.getElementById("pw_confirm").value;

        if (pw !== pwConfirm) {
            alert("비밀번호 확인이 일치하지 않습니다.");
            return false;
        }
        return true;
    }
</script>

</body>
</html>

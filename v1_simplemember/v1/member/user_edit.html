<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 정보 수정</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f5f5f5; }
        .edit-container { width: 420px; margin: auto; padding: 25px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .readonly-input { background-color: #eee; cursor: not-allowed; }
        .admin-only-section { padding: 12px; background-color: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; margin-top: 15px; }
        .admin-tag { font-size: 11px; color: #337ab7; font-weight: bold; margin-bottom: 6px; display: block; }
        .btn-submit { width: 100%; padding: 10px; background-color: #337ab7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-submit:hover { background-color: #286090; }
    </style>
</head>
<body>

<div class="edit-container">
    <h2>회원 정보 수정</h2>
    
    <form action="/user/update" method="POST">
        <input type="hidden" id="target_id" name="id" value="user01">

        <div class="form-group">
            <label>아이디</label>
            <input type="text" class="readonly-input" value="user01" readonly>
        </div>

        <div class="form-group">
            <label for="pw">새 비밀번호</label>
            <input type="password" id="pw" name="pw" placeholder="변경할 비밀번호">
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" value="홍길동">
        </div>

        <div class="form-group">
            <label for="cellphone">전화번호</label>
            <input type="text" id="cellphone" name="cellphone" value="010-1234-5678">
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="text" id="email" name="email" value="user01@example.com">
        </div>

        <div class="admin-only-section" id="adminRoleBox">
            <span class="admin-tag">권한 설정 (관리자)</span>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="role">회원 등급</label>
                <select id="role" name="role">
                    <option value="USER" selected>일반 사용자 (USER)</option>
                    <option value="ADMIN">관리자 (ADMIN)</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn-submit">저장하기</button>
    </form>
</div>

<script>
    const currentUserRole = document.cookie.includes("role=ADMIN") ? "ADMIN" : "USER";

    if (currentUserRole !== "ADMIN") {
        document.getElementById("adminRoleBox").style.display = "none";
    }
</script>

</body>
</html>

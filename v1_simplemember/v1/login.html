<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body { font-family: sans-serif; margin: 60px auto; width: 360px; background-color: #f5f5f5; }
        .login-container { background: white; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 24px; color: #333; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-login { width: 100%; padding: 12px; background-color: #337ab7; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-login:hover { background-color: #286090; }
        .links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13px; }
        .links a { color: #666; text-decoration: none; }
        .links a:hover { text-decoration: underline; color: #333; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>로그인</h2>
    
    <form action="/login" method="POST">
        <div class="form-group">
            <label for="id">아이디</label>
            <input type="text" id="id" name="id" required>
        </div>

        <div class="form-group">
            <label for="pw">비밀번호</label>
            <input type="password" id="pw" name="pw" required>
        </div>

        <button type="submit" class="btn-login">로그인</button>
    </form>

    <div class="links">
        <a href="/find-id">아이디 찾기</a>
        <a href="/find-pw">비밀번호 찾기</a>
        <a href="/register">회원가입</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 삭제</title>
    <style>
        body { font-family: sans-serif; margin: 60px auto; width: 440px; background-color: #f5f5f5; }
        .delete-container { background: white; padding: 30px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; margin-bottom: 16px; color: #d9534f; font-size: 20px; }
        .warning-box { padding: 12px; background-color: #fff3cd; border: 1px solid #ffeeba; color: #856404; border-radius: 4px; font-size: 13px; margin-bottom: 20px; line-height: 1.4; }
        .post-info-box { background-color: #f8f9fa; border: 1px solid #eee; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; }
        .post-info-box p { margin: 6px 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #555; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .button-group { display: flex; justify-content: space-between; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-cancel { background-color: #6c757d; color: white; line-height: 20px; }
        .btn-cancel:hover { background-color: #5a6268; }
        .btn-delete { background-color: #d9534f; color: white; }
        .btn-delete:hover { background-color: #c9302c; }
    </style>
</head>
<body>

<div class="delete-container">
    <h2>게시글 삭제 확인</h2>

    <div class="warning-box">
        삭제된 게시글은 복구할 수 없습니다. 정말로 삭제하시겠습니까?
    </div>

    <!-- 삭제 대상 게시글 간략 정보 -->
    <div class="post-info-box">
        <p><b>게시글 번호:</b> 2</p>
        <p><b>제목:</b> 웹 보안 실습 질문 있습니다.</p>
        <p><b>작성자:</b> user01</p>
    </div>

    <form action="/board/delete" method="POST">
        <!-- 삭제 대상 게시글 ID -->
        <input type="hidden" name="id" value="2">

        <div class="form-group">
            <label for="pw">작성자 비밀번호 확인</label>
            <input type="password" id="pw" name="pw" placeholder="계정 비밀번호를 입력하세요" required>
        </div>

        <div class="button-group">
            <a href="/board/view?id=2" class="btn btn-cancel">취소</a>
            <button type="submit" class="btn btn-delete">영구 삭제</button>
        </div>
    </form>
</div>

</body>
</html>
